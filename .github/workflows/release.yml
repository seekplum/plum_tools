name: release

on:
  push:
    tags: ["*"]

env:
  # renovate: datasource=devbox depName=uv
  UV_VERSION: "0.11.16"

jobs:
  build:
    name: Build project for distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: 写入构建提交信息
        id: build_metadata
        run: |
          uv run --no-project python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          commit_id = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          path = Path("src/plum_tools/_version.py")
          source, count = re.subn(
              r'(?m)^COMMIT_ID = "[^"]*"$',
              f'COMMIT_ID = "{commit_id}"',
              path.read_text(encoding="utf-8"),
          )
          if count != 1:
              raise SystemExit("版本文件必须包含唯一的 COMMIT_ID 字段")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Build project for distribution
        run: uv build

      - name: Upload artifact containing distribution files
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-test:
    name: Publish package distributions to test.pypi.org
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
    environment:
      name: pypi_test
      url: https://test.pypi.org/p/plum_tools
    permissions:
      id-token: write

    steps:
      - name: Download artifact containing distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish package distributions to pypi.org
    runs-on: ubuntu-latest
    needs: [publish-test]
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/plum_tools
    permissions:
      id-token: write

    steps:
      - name: Download artifact containing distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
